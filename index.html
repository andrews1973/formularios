<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Formulario</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
   
    <form id="formulario1" novalidate >
        <fieldset>
            <legend>Datos personales</legend>
            <div>
                <label for="nombre">Nombre</label>
                <input id="nombre" type="text" name="nombre" placeholder="Escribe tu nombre" autofocus tabindex="1">
            </div>

            <div>
                <label for="apellido">Apellido</label>
                <input id="apellido" type="text" name="apellido" placeholder="Escribe tu apellido" tabindex="2">
            </div>

            <div>
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="0" max="100">
            </div>

            <div>
                <label for="sexo">Sexo:</label>
                <label for="hombre">Hombre</label>
                <input type="radio" id="hombre" name="genero" value="hombre">
                <label for="mujer">Mujer</label>
                <input type="radio" id="mujer" name="genero" value="mujer">
                
            </div>

            <div>
                <label for="suscribir">Me siento del club:</label>
                <input type="checkbox" id="suscribir" name="suscribir" value="sí">
            </div>

            <div>
                <label for="suscribir">Escribe algo sobre tí:</label>
                <div>
                    <textarea name="mensaje" id="mensaje" cols="30" rows="10"></textarea>
                </div>
                
            </div>

            
        </fieldset>
        <fieldset>
            <legend>Datos de contacto</legend>
            <div>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Escribe tu mail">
            </div>
            <div>
                <label for="tel">Teléfono</label>
                <input type="tel" name="tel" id="tel">
            </div>

        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset" value="Reset">
    </form>
     <div id="mensajes"></div>

    <script src="js/main.js"></script>
</body>

</html>
